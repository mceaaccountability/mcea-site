<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountability</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            
            /* Radial background gradient */
            background-color: #888888; 
            background: radial-gradient(circle, #e8e8e8 0%, #888888 100%);
            
            color: #0a0a0a; 
            font-family: 'EB Garamond', 'Apple Garamond', Garamond, Baskerville, serif; 
            overflow: hidden;
        }
        .content {
            max-width: 620px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }
        .statement {
            font-size: 1.6rem;
            line-height: 1.5;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .btn-survey {
            display: inline-block;
            font-family: 'EB Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: #0a0a0a;
            border: 1px solid #0a0a0a;
            padding: 12px 32px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .btn-survey:hover {
            background-color: transparent;
            color: #0a0a0a;
        }
        .hidden {
            color: transparent;
            position: absolute;
            bottom: 24px;
            font-size: 1rem;
            cursor: default; 
            letter-spacing: 1px;
            user-select: none;
        }
        ::selection {
            background-color: #000000;
            color: #ffffff; 
            -webkit-text-fill-color: #ffffff; 
        }
    </style>
</head>
<body>
    <main class="content">
        <p class="statement">
            A sudden rush for the exits is never an accident.<br>
            We've never seen people hold on to volunteer positions so aggressively.<br>
            We believe authority was exercised freely behind closed doors.
        </p>
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSea3GUtWDiKf649b9q99i9nwxiRiSgN5wQMOX9N3ZwUhRsbTA/viewform?usp=header" target="_self" class="btn-survey">
            Take Survey
        </a>
    </main>
    
    <div class="hidden">
        You will be held accountable.
    </div>
</body>
</html>
